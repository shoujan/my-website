<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BIZ360</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Loading screen */
        .loader {
            position: absolute;
            inset: 0;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            transition: opacity 0.4s ease;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #e5e7eb;
            border-top-color: #16a34a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loader-text {
            font-family: Arial, sans-serif;
            font-size: 15px;
            color: #555;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="app-container">

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <div class="loader-text"> BIz360...</div>
        </div>

        <iframe
            src="https://biz360.ai.studio"
            title="BIZ360"
            allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
            allowfullscreen>
        </iframe>

    </div>

    <script>
        const iframe = document.querySelector("iframe");
        const loader = document.getElementById("loader");

        iframe.addEventListener("load", () => {
            setTimeout(() => {
                loader.classList.add("hidden");
            }, 500);
        });
    </script>

</body>
</html>
